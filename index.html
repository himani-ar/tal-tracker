// ── Backup system ──
var SB_BACKUPS=SUPABASE_URL+'/rest/v1/tracker_backups';
var _lastBackupTime=0;
var BACKUP_THROTTLE=60000; // 1 backup per minute max

async function sbCreateBackup(content,who){
  var now=Date.now();
  if(now-_lastBackupTime<BACKUP_THROTTLE)return; // throttle
  _lastBackupTime=now;
  try{
    await fetch(SB_BACKUPS,{method:'POST',headers:SB_HEADERS,body:JSON.stringify({content:content,saved_by:who||"Unknown"})});
  }catch(e){console.warn('Backup failed:',e.message)}
}

async function sbListBackups(limit){
  var r=await fetch(SB_BACKUPS+'?select=id,saved_by,created_at&order=created_at.desc&limit='+(limit||20),{headers:SB_HEADERS});
  if(!r.ok)throw new Error(r.status);
  return await r.json();
}

async function sbGetBackup(id){
  var r=await fetch(SB_BACKUPS+'?id=eq.'+id+'&select=content,saved_by,created_at',{headers:SB_HEADERS});
  if(!r.ok)throw new Error(r.status);
  var d=await r.json();
  return d&&d[0]?d[0]:null;
}

async function restoreBackup(id){
  if(!confirm("Restore backup #"+id+"?\n\nYour current data will be backed up first, then replaced with the selected snapshot."))return;
  try{
    // Backup current state first
    _lastBackupTime=0; // force backup
    await sbCreateBackup(S,userName+" (pre-restore)");
    // Fetch the backup
    var backup=await sbGetBackup(id);
    if(!backup||!backup.content||!backup.content.tasks){alert("Backup is empty or corrupt.");return}
    // Restore
    S=backup.content;
    S.meta=S.meta||{};
    S.meta.lastEdited=new Date().toISOString();
    S.meta.editedBy=(userName||"Unknown")+" (restored #"+id+")";
    await sbWrite(S);
    lsSave();
    syncStatus="connected";updateSyncBadge();updateMeta();
    tab="tasks";RR();
    alert("Restored from backup #"+id+" ("+es(backup.saved_by)+", "+new Date(backup.created_at).toLocaleString()+").\n\nYour previous state was backed up first.");
  }catch(e){alert("Restore failed: "+e.message)}
}

async function ld(){
  try{userName=localStorage.getItem(US_KEY)||""}catch{}
  var ni=document.getElementById("user-name");if(ni)ni.value=userName;
  // 1. Try Supabase (source of truth)
  try{
    var row=await sbRead();
    if(row&&row.content&&row.content.tasks){
      S=row.content;
      lsSave(); // backup locally
      syncStatus="connected";updateSyncBadge();return;
    }
  }catch(e){console.warn('Supabase read failed:',e.message)}
  // 2. Supabase failed — try localStorage cache
  var cached=lsLoad();
  if(cached&&cached.tasks){
    S=cached;
    syncStatus="offline";updateSyncBadge();return;
  }
  // 3. Both failed — show error, do NOT load defaults, do NOT write to Supabase
  syncStatus="offline";updateSyncBadge();
  document.getElementById("cnt").innerHTML=
    '<div style="max-width:500px;margin:60px auto;background:#fff;border:1px solid #fecaca;border-radius:10px;padding:28px;text-align:center">'+
    '<div style="font-size:24px;margin-bottom:12px">⚠️</div>'+
    '<div style="font-size:14px;font-weight:600;color:#991b1b;margin-bottom:8px">Unable to load tracker data</div>'+
    '<div style="font-size:12px;color:#64748b;line-height:1.6;margin-bottom:16px">'+
    'Could not reach the database and no local cache was found.<br>'+
    'This usually means you\'re on a new browser/device or your network is down.</div>'+
    '<button onclick="location.reload()" style="padding:8px 20px;font-size:12px;font-weight:600;background:#1e293b;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit">↻ Retry</button>'+
    '</div>';
  throw new Error('Both Supabase and localStorage empty — waiting for retry');
}

async function sv(){
  S.meta=S.meta||{};
  S.meta.lastEdited=new Date().toISOString();
  S.meta.editedBy=userName||"Unknown";
  lsSave();updateMeta();
  if(_saving){_pendingSave=true;return}
  _saving=true;
  try{
    // Snapshot current state before overwriting
    await sbCreateBackup(S,userName||"Unknown");
    await sbWrite(S);
    syncStatus="connected";
  }catch(e){console.warn('Supabase write failed:',e.message);syncStatus="offline"}
  updateSyncBadge();_saving=false;
  if(_pendingSave){_pendingSave=false;await sv()}
}

var _pollTimer=null;
function startPolling(){
  if(_pollTimer)return;
  _pollTimer=setInterval(async function(){
    try{
      var row=await sbRead();
      if(!row||!row.content||!row.content.meta)return;
      var remote=row.content;
      // Only update if remote is newer than local
      var remoteTime=new Date(remote.meta.lastEdited||0).getTime();
      var localTime=new Date(S.meta&&S.meta.lastEdited||0).getTime();
      if(remoteTime>localTime+1000){
        S=remote;lsSave();syncStatus="connected";
        updateSyncBadge();updateMeta();RR();flashSync();
      }
    }catch(e){syncStatus="offline";updateSyncBadge()}
  },8000); // poll every 8 seconds
}

  var t=S.tasks.find(function(x){return x.id===taskId});

function replyCmt(taskId,cmtId){

function resolveCmt(taskId,cmtId){

// @mention autocomplete
function showAC(textarea,acId){
  var el=document.getElementById(acId);if(!el)return;
  var val=textarea.value;
  var cursor=textarea.selectionStart;
  var before=val.substring(0,cursor);
  var atMatch=before.match(/@(\w*)$/);
  if(!atMatch){el.style.display="none";return}
  var query=atMatch[1].toLowerCase();
  var matches=TEAM_NAMES.filter(function(n){return n.toLowerCase().indexOf(query)===0});
  if(!matches.length){el.style.display="none";return}
  var h="";
  matches.forEach(function(name){
    h+='<div class="cmt-ac-item" onmousedown="pickAC(event,\''+acId+"','"+name+"')\">@"+es(name)+"</div>";
  });
  el.innerHTML=h;
  el.style.display="block";
}

function pickAC(event,acId,name){
  event.preventDefault();
  var el=document.getElementById(acId);if(!el)return;
  var textarea=el.parentNode.querySelector("textarea");if(!textarea)return;
  var val=textarea.value;
  var cursor=textarea.selectionStart;
  var before=val.substring(0,cursor);
  var after=val.substring(cursor);
  var newBefore=before.replace(/@\w*$/,"@"+name+" ");
  textarea.value=newBefore+after;
  textarea.selectionStart=textarea.selectionEnd=newBefore.length;
  textarea.focus();
  el.style.display="none";
}

      h+='<td style="text-align:center"><button class="cmt-toggle" onclick="toggleCmt(\''+t.id+'\')">';
      if(openC>0){h+='<span class="cnt-badge">'+openC+'</span>'}
      else if(totalC>0){h+='<span style="color:#22c55e;font-size:10px">✓ '+totalC+'</span>'}
      else{h+='<span style="font-size:10px">+</span>'}
      h+='</button></td></tr>';
      // Expandable comment panel
      if(_expandedComments[t.id]){
        h+='<tr><td colspan="9" style="padding:0;border-bottom:1px solid #e2e8f0">'+renderCmtPanel(t)+'</td></tr>';
      }
    });
    h+='</tbody></table></div>';
  }
  h+='<button onclick="addSection()" style="width:100%;padding:10px;font-size:12px;font-weight:500;color:#3b82f6;background:#fff;border:1px dashed #bfdbfe;border-radius:8px;cursor:pointer;font-family:inherit;margin-bottom:12px">+ Add Section / Module</button>';
  h+='<div style="font-size:10px;color:#94a3b8;padding:6px 0;line-height:1.8"><b>Target</b> = committed date. <b>Start/End</b> = current estimate. Double-click to edit. Click status to cycle.<br><span style="display:inline-block;width:10px;height:10px;background:#1e293b;border-radius:1px;vertical-align:middle"></span> = Target marker.</div>';
  el.innerHTML=h;
}

function rQs(el){
  var oq=S.questions.filter(function(q){return q.status==="Open"}).length;
  var h='<div class="wg"><div class="wh"><div class="d" style="background:#ef4444"></div><span class="nm">Open Questions</span><span class="ct">'+oq+' open</span></div>';
  h+='<div style="display:grid;grid-template-columns:70px 1.2fr 90px 1.5fr 80px 26px;padding:5px 14px;font-size:9px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em;background:#fafbfc;border-bottom:1px solid #f1f5f9"><span>Area</span><span>Question</span><span>Owner</span><span>Answer</span><span>Status</span><span></span></div>';
  S.questions.forEach(function(q){
    var a=AC2[q.area]||{b:"#f3f4f6",f:"#6b7280"},sc=q.status==="Open"?"#ef4444":q.status==="Answered"?"#22c55e":"#94a3b8";
    h+='<div class="qr"><span class="at" style="background:'+a.b+';color:'+a.f+'" ondblclick="iqe(this,'+q.id+',\'area\')">'+es(q.area)+'</span>';
    h+='<span class="ec" ondblclick="iqe(this,'+q.id+',\'q\')" style="font-size:12px">'+es(q.q)+'</span>';
    h+='<span class="ec" ondblclick="iqe(this,'+q.id+',\'owner\')" style="font-size:12px;color:#64748b">'+es(q.owner)+'</span>';
    h+='<span class="ec '+(q.answer?"":"ph")+'" ondblclick="iqe(this,'+q.id+',\'answer\')" style="font-size:12px">'+(q.answer||"double-click...")+'</span>';
    h+='<span class="sp" onclick="cq('+q.id+')" style="background:'+sc+'18;color:'+sc+'">'+q.status+'</span>';
    h+='<button class="dl" onclick="dQ('+q.id+')" style="opacity:.3">✕</button></div>';
  });
  h+='<button class="aq" onclick="aQ()">+ Add question</button></div>';el.innerHTML=h;
}
